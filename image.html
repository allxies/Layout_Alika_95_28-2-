<!DOCTYPE html>
<html>
    <head>
        <title> Image HTML dan CSS </title>
        <link rel="stylesheet" href="image.css">
    </head>
    <body>
    <!-- cara menambahkan gambar dengan ukuran normal, format gambar: .jpg/.jpeg/.png/.gif -->
     <p> ini adalah gambar dengan ukuran normal </p>
     <img src="sylvanian.jpg" alt="sylvanian">

     <!-- cara mengubah ukuran pada gambar -->
      <p> ini adalah gambar yang sudah diberi ukuran </p>
      <img src="sylvanian.jpg" alt="sylvanian" class="ukuran">

      <!-- cara memberikan lengkungan pada gambar -->
       <p> ini adalah gambar yang sudah diberi border </p>
       <img src="sylvanian.jpg" alt="sylvanian" class="lengkungan">

       <!-- cara menggabungkan gambar dan teks -->
        <div class="kelompok"> 
            <img src="sylvanian.jpg" alt="sylvanian">
            <p> Gambar Sylvanian </p>
        </div>


        <!-- cara membari efek hover -->
         <div class="efek">
         <img src="sylvanian.jpg" alt="sylvanian">
         <P> Ini adalah contoh hover </P>
         </div>
         <!-- ini font eksternal, format font: otf/ttf -->
          <p class="eksternal"> ini font eksternal </p>

         <!-- cara memberi font-->
          <div class="efek hover">
         <img src="sylvanian.jpg" alt="sylvanian">
         </div>
          <p class="eksternal"> ini font eksternal </p>

    </body>
</html>
